name: cron-probe

# 臨時驗證用: 確認呢個 repo 嘅 schedule 事件真的會觸發。
# 之前嘅 fork (jardanlau2020/zampto) 19 個 run 入面 0 個 schedule —— GitHub 嘅
# schedule 事件唔喺 fork 上跑。遷到獨立 repo 之後用呢個探针驗證，
# 確認有 schedule run 出現之後就可以刪除呢個 workflow。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    name: 驗證 cron 觸發
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 打印觸發信息
        run: |
          echo "cron probe fired"
          echo "  repo    : $GITHUB_REPOSITORY"
          echo "  event   : $GITHUB_EVENT_NAME"
          echo "  sha     : $GITHUB_SHA"
          echo "  ref     : $GITHUB_REF"
          echo "  time    : $(date -u +%FT%TZ)"
          echo "  run_no  : $GITHUB_RUN_NUMBER"
