name: Zampto 自动续期

on:
  # 每 8 小时（UTC 00/08/16）—— Zampto 到期窗口是 48h，这个频率确保过眼前
  # 至少有 5 次机会。
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      force_renew:
        description: '无视剩余时间强制续期'
        type: choice
        options: ['false', 'true']
        default: 'false'
      enable_recording:
        description: '录制屏幕（排障用，产物只留 3 天）'
        type: choice
        options: ['false', 'true']
        default: 'false'
      dry_run:
        description: '演练：照跑一遍，但跳过 Telegram 通知（消息原文会打进日志）'
        type: boolean
        default: false

# 历史背景（2026-09-28 复活那次，别删 —— 下次红绿灯时先看这段）：
#   当时红灯是两件事叠加：(a) 旧 session cookie 已失效（就算干净出口也只当未登录
#   → 307 /auth/login）；(b) 阿里云机房出口在站方 VPN 黑名单（带有效 session 才
#   触发 403 /blocked，未登录反而正常，所以「无 cookie 探针」会把被标记的出口
#   误判成干净）。对策：换 RO hysteria2 住宅级出口 + 用户亲手贴的新 session。
#   实测 run #70（36425660554）success：出口探针 PROXY_OK=1、Turnstile 63.8s
#   自行通过、POST /api/server/renew → 200。
#   若日后再红：先看是出口探针失败（换节点）还是 session 失效（重新贴 cookie）。

jobs:
  zampto-auto:
    name: 检查并自动续期
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: "llvmpipe"
      # 全部凭据来自 repo Secrets（Settings -> Secrets and variables -> Actions）。
      # .github/secrets_chunks.json 已删除：git 里不再有任何凭据。
      # ⚠ 舊註解「REST API PUT /actions/secrets 有 7 字符硬上限」已於 2026-09-28
      #   證偽：用 PyNaCl SealedBox（libsodium sealed box）加密後 PUT 完全正常
      #   —— 當日成功寫入 182 字的 PROXY_URI。之前 422 是用錯 Box 而非 SealedBox。
      PROXY_URI: ${{ secrets.PROXY_URI }}
      TUIC_URI: ${{ secrets.TUIC_URI }}
      ZAMPTO_SESSION_SECRET: ${{ secrets.ZAMPTO_SESSION_SECRET }}
      ZAMPTO_USERNAME: ${{ secrets.ZAMPTO_USERNAME }}
      ZAMPTO_PASSWORD: ${{ secrets.ZAMPTO_PASSWORD }}
      ZAMPTO_SERVER_ID: ${{ secrets.ZAMPTO_SERVER_ID }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

    steps:
      - uses: actions/checkout@v7

      # 这一层校验纯粹是为了「缺 secret 时说人话」。原先只认 PROXY_URI，
      # 而 scripts/setup_proxy.sh 是 PROXY_URI -> TUIC_URI 两级候选 —— 也就是
      # 只配了 TUIC_URI 的仓库会在校验步就被拦下，兜底候选永远轮不到。
      - name: "🔑 校验 Secrets 配置"
        run: |
          set -uo pipefail
          missing=0
          for name in ZAMPTO_SESSION_SECRET ZAMPTO_USERNAME ZAMPTO_PASSWORD ZAMPTO_SERVER_ID; do
            val="${!name}"
            if [ -z "$val" ]; then
              echo "[ERROR] Secret $name 未配置！请到 Settings -> Secrets and variables -> Actions 添加"
              missing=1
            else
              echo "[OK] $name 已配置 (${#val} chars)"
            fi
          done
          if [ -n "$PROXY_URI" ]; then
            echo "[OK] 代理节点已配置 (PROXY_URI, ${#PROXY_URI} chars)"
          elif [ -n "$TUIC_URI" ]; then
            echo "[OK] 代理节点已配置 (TUIC_URI 兜底, ${#TUIC_URI} chars)"
          else
            echo "[ERROR] PROXY_URI / TUIC_URI 都没配！GitHub 裸出口会被 Cloudflare 风控(403)，续期必失败"
            missing=1
          fi
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            echo "[OK] Telegram 通知已配置"
          else
            echo "[WARN] Telegram 未配置 (TG_BOT_TOKEN / TG_CHAT_ID)，失败将无法推送提醒"
          fi
          [ "$missing" -eq 0 ] || exit 1

      # 依赖安装、出口准备、主脚本、失败产物与兜底通知全在这一步里（renew-kit
      # composite action）。顺序是 apt -> pip -> setup-command -> command。
      #
      # setup-continue-on-error: 'false' —— 出口准备失败（候选与直连都被 Zampto
      # 标记）时直接中止，别让主脚本拿一个必被 403 的出口白跑 20 分钟。
      - name: 🔄 运行续期脚本（renew-kit）
        uses: jardanlau2020/renew-kit/.github/actions/renew@v0.5.3
        with:
          script: zampto_auto.py
          python-version: '3.12'
          renewkit-ref: v0.5.3
          apt-packages: >-
            xvfb ffmpeg curl unzip fonts-noto-cjk
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1
            libxfixes3 libxrandr2 libgbm1 libasound2t64
          setup-command: |
            python -m playwright install chromium
            bash scripts/setup_proxy.sh
          setup-continue-on-error: 'false'
          command: bash scripts/run_zampto.sh
          artifact-paths: |
            ./screenshots/*.png
          artifact-name: debug-${{ github.run_number }}
          notify-on-failure: 'true'
        env:
          FORCE_RENEW: ${{ inputs.force_renew || 'false' }}
          ENABLE_RECORDING: ${{ inputs.enable_recording || 'false' }}
          # 空串 = 关（renewkit.env 的真值集合是 1/true/yes/y/on）
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

      - name: 🧽 清理进程
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromium || true
          pkill -f Xvfb || true

      - name: 🎥 上传录屏
        if: always() && inputs.enable_recording == 'true'
        uses: actions/upload-artifact@v7
        env:
          # upload-artifact 是 Node 写的：undici 不认 socks5h:// 代理，会抛
          # "Invalid URL protocol"。这里显式清空，不指望上游步骤的 $GITHUB_ENV。
          ALL_PROXY: ''
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
          NO_PROXY: '*'
        with:
          name: recording-${{ github.run_number }}
          path: /tmp/recording.mp4
          if-no-files-found: ignore
          retention-days: 3
