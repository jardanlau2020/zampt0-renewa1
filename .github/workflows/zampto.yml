# 鍘嗗彶鑳屾櫙锛?026-09-28 澶嶆椿閭ｆ锛屽埆鍒?鈥斺€?涓嬫绾㈢豢鐏椂鍏堢湅杩欐锛夛細
#   褰撴椂绾㈢伅鏄袱浠朵簨鍙犲姞锛?a) 鏃?session cookie 宸插け鏁堬紙灏辩畻骞插噣鍑哄彛涔熷彧褰撴湭鐧诲綍
#   鈫?307 /auth/login锛夛紱(b) 闃块噷浜戞満鎴垮嚭鍙ｅ湪绔欐柟 VPN 榛戝悕鍗曪紙甯︽湁鏁?session 鎵?
#   瑙﹀彂 403 /blocked锛屾湭鐧诲綍鍙嶈€屾甯革紝鎵€浠ャ€屾棤 cookie 鎺㈤拡銆嶄細鎶婅鏍囪鐨勫嚭鍙?
#   璇垽鎴愬共鍑€锛夈€傚绛栵細鎹?RO hysteria2 浣忓畢绾у嚭鍙?+ 鐢ㄦ埛浜叉墜璐寸殑鏂?session銆?
#   瀹炴祴 run #70锛?6425660554锛塻uccess锛氬嚭鍙ｆ帰閽?PROXY_OK=1銆乀urnstile 63.8s
#   鑷閫氳繃銆丳OST /api/server/renew 鈫?200銆?
#   鑻ユ棩鍚庡啀绾細鍏堢湅鏄嚭鍙ｆ帰閽堝け璐ワ紙鎹㈣妭鐐癸級杩樻槸 session 澶辨晥锛堥噸鏂拌创 cookie锛夈€?

jobs:
  zampto-auto:
    name: 妫€鏌ュ苟鑷姩缁湡
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: "llvmpipe"
      # 鍏ㄩ儴鍑嵁鏉ヨ嚜 repo Secrets锛圫ettings -> Secrets and variables -> Actions锛夈€?
      # .github/secrets_chunks.json 宸插垹闄わ細git 閲屼笉鍐嶆湁浠讳綍鍑嵁銆?
      # 鈿?鑸婅ɑ瑙ｃ€孯EST API PUT /actions/secrets 鏈?7 瀛楃纭笂闄愩€嶅凡鏂?2026-09-28
      #   璀夊伣锛氱敤 PyNaCl SealedBox锛坙ibsodium sealed box锛夊姞瀵嗗緦 PUT 瀹屽叏姝ｅ父
      #   鈥斺€?鐣舵棩鎴愬姛瀵叆 182 瀛楃殑 PROXY_URI銆備箣鍓?422 鏄敤閷?Box 鑰岄潪 SealedBox銆?
      PROXY_URI: ${{ secrets.PROXY_URI }}
      TUIC_URI: ${{ secrets.TUIC_URI }}
      # 2026-10-13 鍔狅細cfnew 瀹跺瑷傞柋锛坢ihomo/Clash YAML锛夈€傝惤鍦颁總鐪熶綇瀹呭甯讹紝
      # 瀵︽脯 KR/TH 钀藉湴 鈫?/api/servers 200锛堟鎴跨瘈榛炰竴寰?403锛夈€傛湁鍜椾舰灏卞敂闈?PROXY_URI銆?
      ZAMPO_SUB_URL: ${{ secrets.ZAMPO_SUB_URL }}
      ZAMPTO_SESSION_SECRET: ${{ secrets.ZAMPTO_SESSION_SECRET }}
      ZAMPTO_USERNAME: ${{ secrets.ZAMPTO_USERNAME }}
      ZAMPTO_PASSWORD: ${{ secrets.ZAMPTO_PASSWORD }}
      ZAMPTO_SERVER_ID: ${{ secrets.ZAMPTO_SERVER_ID }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

    steps:
      - uses: actions/checkout@v7

      # 杩欎竴灞傛牎楠岀函绮规槸涓轰簡銆岀己 secret 鏃惰浜鸿瘽銆嶃€傚師鍏堝彧璁?PROXY_URI锛?
      # 鑰?scripts/setup_proxy.sh 鏄?PROXY_URI -> TUIC_URI 涓ょ骇鍊欓€?鈥斺€?涔熷氨鏄?
      # 鍙厤浜?TUIC_URI 鐨勪粨搴撲細鍦ㄦ牎楠屾灏辫鎷︿笅锛屽厹搴曞€欓€夋案杩滆疆涓嶅埌銆?
      - name: "馃攽 鏍￠獙 Secrets 閰嶇疆"
        run: |
          set -uo pipefail
          missing=0
          for name in ZAMPTO_SESSION_SECRET ZAMPTO_USERNAME ZAMPTO_PASSWORD ZAMPTO_SERVER_ID; do
            val="${!name}"
            if [ -z "$val" ]; then
              echo "[ERROR] Secret $name 鏈厤缃紒璇峰埌 Settings -> Secrets and variables -> Actions 娣诲姞"
              missing=1
            else
              echo "[OK] $name 宸查厤缃?(${#val} chars)"
            fi
          done
          if [ -n "$ZAMPO_SUB_URL" ]; then
            echo "[OK] cfnew 瀹跺璁㈤槄宸查厤缃?(ZAMPO_SUB_URL, ${#ZAMPO_SUB_URL} chars) 鈥斺€?mihomo 璺嚎"
          elif [ -n "$PROXY_URI" ]; then
            echo "[OK] 浠ｇ悊鑺傜偣宸查厤缃?(PROXY_URI, ${#PROXY_URI} chars)"
          elif [ -n "$TUIC_URI" ]; then
            echo "[OK] 浠ｇ悊鑺傜偣宸查厤缃?(TUIC_URI 鍏滃簳, ${#TUIC_URI} chars)"
          else
            echo "[ERROR] ZAMPO_SUB_URL / PROXY_URI / TUIC_URI 閮芥病閰嶏紒GitHub 瑁稿嚭鍙ｄ細琚?Cloudflare 椋庢帶(403)锛岀画鏈熷繀澶辫触"
            missing=1
          fi
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            echo "[OK] Telegram 閫氱煡宸查厤缃?
          else
            echo "[WARN] Telegram 鏈厤缃?(TG_BOT_TOKEN / TG_CHAT_ID)锛屽け璐ュ皢鏃犳硶鎺ㄩ€佹彁閱?
          fi
          [ "$missing" -eq 0 ] || exit 1

      # 渚濊禆瀹夎銆佸嚭鍙ｅ噯澶囥€佷富鑴氭湰銆佸け璐ヤ骇鐗╀笌鍏滃簳閫氱煡鍏ㄥ湪杩欎竴姝ラ噷锛坮enew-kit
      # composite action锛夈€傞『搴忔槸 apt -> pip -> setup-command -> command銆?
      #
      # setup-continue-on-error: 'false' 鈥斺€?鍑哄彛鍑嗗澶辫触锛堝€欓€変笌鐩磋繛閮借 Zampto
      # 鏍囪锛夋椂鐩存帴涓锛屽埆璁╀富鑴氭湰鎷夸竴涓繀琚?403 鐨勫嚭鍙ｇ櫧璺?20 鍒嗛挓銆?
      - name: 馃攧 杩愯缁湡鑴氭湰锛坮enew-kit锛?
        uses: jardanlau2020/renew-kit/.github/actions/renew@v0.6.0
        with:
          script: zampto_auto.py
          python-version: '3.12'
          renewkit-ref: v0.6.0
          apt-packages: >-
            xvfb ffmpeg curl unzip fonts-noto-cjk
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1
            libxfixes3 libxrandr2 libgbm1 libasound2t64
          setup-command: |
            python -m playwright install chromium
            bash scripts/setup_proxy.sh
          setup-continue-on-error: 'false'
          command: bash scripts/run_zampto.sh
          artifact-paths: |
            ./screenshots/*.png
          artifact-name: debug-${{ github.run_number }}
          notify-on-failure: 'true'
        env:
          FORCE_RENEW: ${{ inputs.force_renew || 'false' }}
          ENABLE_RECORDING: ${{ inputs.enable_recording || 'false' }}
          # 绌轰覆 = 鍏筹紙renewkit.env 鐨勭湡鍊奸泦鍚堟槸 1/true/yes/y/on锛?
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

      - name: 馃Ы 娓呯悊杩涚▼
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromium || true
          pkill -f Xvfb || true

      - name: 馃帴 涓婁紶褰曞睆
        if: always() && inputs.enable_recording == 'true'
        uses: actions/upload-artifact@v7
        env:
          # upload-artifact 鏄?Node 鍐欑殑锛歶ndici 涓嶈 socks5h:// 浠ｇ悊锛屼細鎶?
          # "Invalid URL protocol"銆傝繖閲屾樉寮忔竻绌猴紝涓嶆寚鏈涗笂娓告楠ょ殑 $GITHUB_ENV銆?
          ALL_PROXY: ''
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
          NO_PROXY: '*'
        with:
          name: recording-${{ github.run_number }}
          path: /tmp/recording.mp4
          if-no-files-found: ignore
          retention-days: 3

