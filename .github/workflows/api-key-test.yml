          for c in sess["cookies"]:
              s.cookies.set(c["name"], c["value"], domain=c.get("domain","").lstrip("."))
          s.get("https://dash.zampto.net/server?id=15629", timeout=30)
          csrf = s.cookies.get("zampto_csrf","")
          print("csrf len:", len(csrf))
          def hit(method, path, body=None, extra=None, tag=""):
              h = {"X-CSRF-Token": csrf}
              h.update(extra or {})
              try:
                  r = s.request(method, "https://dash.zampto.net"+path, json=body, headers=h, timeout=30)
                  print(f"{method} {path} [{tag}] -> {r.status_code} {r.text[:150]}")
              except Exception as e:
