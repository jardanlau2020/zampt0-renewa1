name: Zampto API-Key Test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🔑 API-key sweep
        run: |
          set -e
          KEY="$(python3 -c "import json;print(''.join(json.load(open('.github/secrets_chunks.json'))['CAK']))")"
          echo "KEY len: ${#KEY}  head: ${KEY:0:6}..."
          pip install -q requests
          python3 - "$KEY" <<'PYEOF'
import requests, sys, json
key = sys.argv[1]
UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36'}
def hit(method, path, body=None, **kw):
    hdrs = dict(UA)
    hdrs.update(kw.get('extra', {}))
    try:
        r = requests.request(method, 'https://dash.zampto.net'+path, json=body, headers=hdrs, timeout=30)
        print(f'{method} {path} {kw.get("tag","")} -> {r.status_code} {r.text[:160]}')
        return r
    except Exception as e:
        print(f'{method} {path} ERR {str(e)[:120]}')
        return None

print('=== Phase 1: no-auth probes (IP reputation check) ===')
hit('GET', '/api/user', tag='no-auth')

print('\n=== Phase 2: Bearer auth, no body ===')
for p in ['/api/server/renew','/api/servers/renew','/api/server/15629/renew','/api/v1/server/renew']:
    hit('POST', p, extra={'Authorization': f'Bearer {key}'}, tag='bearer')

print('\n=== Phase 3: X-API-Key + body ===')
for p in ['/api/server/renew','/api/servers/renew']:
    hit('POST', p, {'server_id':'15629'}, extra={'X-API-Key': key}, tag='xapikey')

print('\n=== Phase 4: api_key in body ===')
hit('POST', '/api/server/renew', {'server_id':'15629','api_key':key}, tag='body')

print('\n=== Phase 5: query param ===')
for p in [f'/api/server/renew?key={key}', f'/api/server/renew&api_key={key}']:
    hit('GET', p, tag='qparam')
PYEOF
