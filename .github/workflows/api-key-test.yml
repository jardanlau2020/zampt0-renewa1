name: Zampto API-Key Test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: List servers
        run: |
          pip install -q requests
          python3 << 'PYEOF'
          import requests, json, base64
          raw = json.load(open(".github/secrets_chunks.json"))
          sess_b64 = "".join(raw["CSE"])
          sess = json.loads(base64.b64decode(sess_b64))
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"}
          s = requests.Session(); s.headers.update(UA)
          for c in sess["cookies"]:
              s.cookies.set(c["name"], c["value"], domain=c.get("domain","").lstrip("."))
          s.get("https://dash.zampto.net/server?id=15629", timeout=60)
          csrf = s.cookies.get("zampto_csrf","")
          def get(path, tag=""):
              try:
                  r = s.get("https://dash.zampto.net"+path, headers={"X-CSRF-Token":csrf}, timeout=60)
                  print(f"{tag} {path} -> {r.status_code} {r.text[:500]}")
              except Exception as e:
                  print(f"{tag} {path} ERR {str(e)[:120]}")
          get("/api/servers", "[A]")
          get("/api/server", "[B]")
          get("/api/servers?limit=50", "[C]")
          PYEOF
